<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111b"><title>MacGregor PLC Atlas Project</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="head"><div><h1>MacGregor DK II — PLC Service Atlas</h1><div class="sub">Модульный проект: PLC, PWM, датчики, актуаторы, схемы и мануал</div></div><div class="actions"><button id="exportBtn">Экспорт</button><button id="clearBtn">Сброс статусов</button></div></div></header>

<dialog id="zoom"><div class="dHead"><b id="zTitle"></b><button id="closeZoom">Закрыть</button></div><div class="dBody"><img id="zImg" class="srcimg"></div></dialog><div class="version">PROJECT 1.0 · MULTI-FILE</div><script src="app.js"></script></body></html>
